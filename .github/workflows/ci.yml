name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Dependency audit
        run: python -m pip_audit -r requirements.lock

      - name: Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Cache Blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/blender
          key: blender-5.2.2-linux-x64

      - name: Install Blender 5.2.2 (SHA256 verified)
        run: bash scripts/install_blender_ci.sh "$HOME/blender"

      - name: Blender integration tests (Cycles CPU, 128x72, all ten views)
        run: |
          export EXTERIOR_AGENT_BLENDER="$HOME/blender/blender-5.2.2-linux-x64/blender"
          "$EXTERIOR_AGENT_BLENDER" --version | head -n 1
          python -m pytest tests/integration -v
